<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expo</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4f4f">
<meta name="apple-mobile-web-app-title" content="Expo">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: barra de herramientas arriba; lista de stock | plano a escala (metros) | propiedades */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1d2321; --muted:#5f6a66; --line:#d9dedb;
  --accent:#0b6e6e; --accent-fg:#ffffff; --accent-soft:#d8ecea;
  --floor:#e6e8e3; --grid-minor:#d6d9d2; --grid-major:#c2c6be; --lot-edge:#7b847f;
  --stall:#d9a400; --stall-fill:rgba(217,164,0,.07); --plan-text:#38403c;
  --ok:#2f8f4e; --warn:#c98a00; --bad:#c43c3c; --info:#2f6fb3; --idle:#8a8f8c;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
  --font-plate:"Space Grotesk","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151918; --panel:#1d2221; --fg:#e7ebe9; --muted:#9aa5a1; --line:#313937;
  --accent:#3bb3b0; --accent-fg:#06201f; --accent-soft:#163b3a;
  --floor:#262b2a; --grid-minor:#2f3534; --grid-major:#3c4442; --lot-edge:#8a9490;
  --stall:#e8b923; --stall-fill:rgba(232,185,35,.06); --plan-text:#cfd6d3;
  --ok:#4cb46c; --warn:#e0a52a; --bad:#e06464; --info:#5d9be0; --idle:#7d8481;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151918; --panel:#1d2221; --fg:#e7ebe9; --muted:#9aa5a1; --line:#313937;
  --accent:#3bb3b0; --accent-fg:#06201f; --accent-soft:#163b3a;
  --floor:#262b2a; --grid-minor:#2f3534; --grid-major:#3c4442; --lot-edge:#8a9490;
  --stall:#e8b923; --stall-fill:rgba(232,185,35,.06); --plan-text:#cfd6d3;
  --ok:#4cb46c; --warn:#e0a52a; --bad:#e06464; --info:#5d9be0; --idle:#7d8481;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{width:30px;height:30px;flex:none;align-self:center}
.brand h1{font:700 21px/1 var(--font-head);margin:0 4px 0 0;letter-spacing:-.02em}
.brand #planName{color:var(--muted);font-size:12px;max-width:22ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sep{width:1px;height:22px;background:var(--line)}
.addbar{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.add{--c:var(--muted);display:flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;border-radius:9px;padding:4px 12px 4px 4px;text-align:left;transition:background .15s,border-color .15s,transform .15s}
.add:hover{background:var(--panel);border-color:var(--line);transform:translateY(-1px)}
.add:active{transform:translateY(0)}
.add .ico{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c)}
.add .ico svg{width:22px;height:22px}
.add .ico::after{content:"+";position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--c);color:var(--panel);font:700 13px/16px var(--font-ui);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.add .lbl b{display:block;font:600 13.5px/1.15 var(--font-head)}
.add .lbl small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.add-car{--c:var(--accent);background:var(--accent-soft)}
.add-row{--c:var(--stall)}
.add-zone{--c:var(--info)}
.add-text{--c:var(--muted)}
@media (max-width:600px){
  .addbar{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  .add{flex-direction:column;gap:5px;padding:7px 2px 6px}
  .add .lbl b{text-align:center}
  .add .lbl small{display:none}
}
.sync{font-size:11.5px;font-weight:600;padding:3px 9px 3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--idle)}
.sync[data-st="ok"]::before{background:var(--ok)}
.sync[data-st="wait"]::before{background:var(--warn)}
.sync[data-st="bad"]::before{background:var(--bad)}
.sync[data-st="ro"]::before{background:var(--info)}
.sync.clickable{cursor:pointer;border-color:var(--info)}
.sync.clickable:hover{background:var(--panel)}
.syncwho{font-size:11.5px;color:var(--muted);white-space:nowrap}
.brand{flex-wrap:wrap}
.stagemsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.msgcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:460px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.msgcard h3{margin:0;font:700 18px/1.2 var(--font-head)}
.msgcard p{margin:0;color:var(--muted);font-size:13.5px}
.msgcard .actions{flex-direction:column;align-items:stretch}
body.readonly #props .f,body.readonly #props .actions{pointer-events:none;opacity:.6}
body.readonly .addbar,body.readonly #bSort,body.readonly #bImport,body.readonly #bUndo,body.readonly #bRedo,body.readonly .item .place{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.icon{padding:6px 8px;min-width:32px;justify-content:center}
.btn svg{width:16px;height:16px;flex:none}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select.sm{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 6px;font-size:13px}

/* Cuerpo */
main{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 300px}
aside{background:var(--panel);min-height:0;overflow:auto;display:flex;flex-direction:column}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec h2{font:600 11px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font:700 20px/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11.5px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{font-size:12.5px;padding:6px 8px;border-radius:6px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);border-left:3px solid var(--warn);cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0}
.alert.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);border-left-color:var(--bad)}
.note{font-size:12.5px;background:var(--accent-soft);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.note .row{display:flex;gap:6px;flex-wrap:wrap}
.search{display:flex;gap:6px}
.search #fCat,.search #fEstado{flex:1}
.search input,.search select{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;font-size:13px}
.search input{flex:1}
.list{display:flex;flex-direction:column;padding:4px 8px 16px}
.list h3{font:600 11px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;user-select:none}
.item:hover{background:var(--bg)}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.item .dot{width:8px;height:8px;border-radius:50%}
.item .t{min-width:0}
.item .t b{font:600 13px/1.2 var(--font-plate);letter-spacing:.03em}
.item .t .hd{display:flex;align-items:center;gap:7px;min-width:0;color:var(--fg)}
.item .t .hd .pill{font-size:10.5px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.item .t div{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.item .r .pr{font-weight:600}
.item .r .ct{font-size:10.5px;color:var(--muted)}
.item .r .spot{font:600 11px/1 var(--font-plate);padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.item .r .place{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--accent);color:var(--accent);background:transparent}
.empty{color:var(--muted);font-size:12.5px;padding:6px 8px}

/* Plano */
.stage{position:relative;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#plan.panning{cursor:grabbing}
.overlay{position:absolute;pointer-events:none;display:flex;gap:8px}
.legend{left:max(12px,env(safe-area-inset-left,0px));bottom:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legend .chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 6px;font-size:11.5px}
.legend .chip.lbl{background:transparent;border:0;font-weight:600;color:var(--muted);padding-left:6px}
.legend .chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.zoom{right:max(12px,env(safe-area-inset-right,0px));bottom:12px;pointer-events:auto;flex-direction:column;gap:4px}
.hint{right:max(12px,env(safe-area-inset-right,0px));top:10px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:6px}
.tabs{left:max(12px,env(safe-area-inset-left,0px));top:10px;pointer-events:auto;flex-wrap:wrap;gap:4px;max-width:calc(100% - 24px);align-items:center}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 13px;font-weight:600;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab:hover{border-color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab.add,.tab.more{font-weight:500;color:var(--muted);padding:6px 10px}
.hint{display:none}
.moves{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.moves th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.moves td{padding:6px 8px;border-bottom:1px solid var(--line)}
.moves td.pl{font:600 13px var(--font-plate);white-space:nowrap}
.moves td.to{font-weight:700;color:var(--accent)}
.movewrap{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.stage.drop-ok{outline:3px dashed var(--accent);outline-offset:-6px}

/* Propiedades */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;font-size:13px}
.f textarea{min-height:60px;resize:vertical}
.f input.plate{font:600 15px/1.2 var(--font-plate);letter-spacing:.06em;text-transform:uppercase}
.f.check{flex-direction:row;align-items:center;gap:8px}
.f.check input{width:auto}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:flex;justify-content:space-between;font-size:13px}
.kv span{color:var(--muted)}
.keys{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
kbd{font:600 11px/1 var(--font-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--bg);color:var(--fg)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}

/* Ventanas */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,13,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);color:var(--fg);border-radius:12px;width:min(660px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal header{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font:700 17px/1.2 var(--font-head)}
.modal .body{padding:8px 18px 12px;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.modal p{margin:0;color:var(--muted);font-size:13px}
.modal textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.rows-check{display:flex;flex-wrap:wrap;gap:6px}
.rows-check label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px}
.summary{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.update{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.15);max-width:calc(100% - 32px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.catlist{display:flex;flex-direction:column;gap:6px}
.catrow{display:grid;grid-template-columns:40px minmax(0,1fr) 62px 34px 66px;gap:8px;align-items:center}
.catrow.est{grid-template-columns:40px minmax(0,1fr) 160px 62px 34px 66px}
.catrow .btn{justify-content:center}
.catrow select.tipo{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 6px;font-size:12.5px}
.modal .search select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 6px;font-size:13px;min-width:0}
@media (max-width:600px){.catrow.est{grid-template-columns:40px minmax(0,1fr) 34px 66px}.catrow.est .catn{display:none}.catrow.est select.tipo{grid-column:2/-1;grid-row:2}}
.catrow input[type=text]{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;font-size:13px}
.catrow input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:pointer}
.catn{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn.linkish{justify-content:center}
.imgprev{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}

@media (max-width: 980px){
  body{overflow:auto;height:auto}
  html{height:auto}
  main{display:flex;flex-direction:column}
  .stage{height:68vh;order:1;border-bottom:1px solid var(--line)}
  aside.right{order:2;border-left:0}
  aside.left{order:3;border-right:0}
  aside{overflow:visible}
  .hint{display:none}
}
@media print{
  .bar,aside,.overlay{display:none!important}
  body,main{display:block;height:auto;overflow:visible}
  .stage{height:95vh}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0b4f4f"/>
  <path d="M10 13V51H54V13M24.7 13V51M39.3 13V51" fill="none" stroke="#f2c230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="27.6" y="17" width="8.8" height="27" rx="3.8" fill="#ffffff"/>
  <rect x="28.9" y="22" width="6.2" height="3.6" rx="1.2" fill="#0b4f4f" opacity=".85"/>
  <rect x="28.9" y="37.4" width="6.2" height="2.4" rx="1" fill="#0b4f4f" opacity=".6"/></svg><h1>Expo</h1><span id="planName"></span><span class="sync" id="sync" data-st="wait" title="Dónde se guarda el plano"></span><span class="syncwho" id="syncWho"></span></div>
  <div class="tools">
    <div class="addbar" role="group" aria-label="Añadir">
      <button class="add add-car" id="bAddCar" title="Añadir un coche al stock">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 15.5v-3.2l2.3-4.6c.3-.5.8-.8 1.4-.8h9.1c.5 0 1 .2 1.3.6l3 3.6 1.4.4c.4.1.6.4.6.8v3.2h-1.6"/><path d="M8.6 15.5h6.8"/><path d="M5.2 11h13.4"/><circle cx="6.6" cy="15.8" r="1.9"/><circle cx="17.4" cy="15.8" r="1.9"/></svg></span>
        <span class="lbl"><b>Coche</b><small>al stock</small></span>
      </button>
      <button class="add add-row" id="bRow" title="Dibujar una fila de plazas">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4v15h18V4M9 4v15M15 4v15"/></svg></span>
        <span class="lbl"><b>Plazas</b><small>una fila</small></span>
      </button>
      <button class="add add-zone" id="bZone" title="Añadir una zona (oficina, entrada, taller…)">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="currentColor" fill-opacity=".18"/><path d="M8 19v-5h4v5"/><path d="M14.5 9h3"/></svg></span>
        <span class="lbl"><b>Zona</b><small>oficina, taller…</small></span>
      </button>
      <button class="add add-text" id="bText" title="Añadir un rótulo">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6.5V5h14v1.5M12 5v14M9 19h6"/></svg></span>
        <span class="lbl"><b>Rótulo</b><small>texto</small></span>
      </button>

  const free = spotsSel.filter(s => !fixedSpots.has(s.id));
  const pool = cars.filter(c => !fixed.includes(c) && !isSold(c) && (o.prep || tipoDe(c) !== 'fuera') &&

function applyMoves(from, to){

const HEAD = {
  matricula:['matricula','matrícula','placa','plate','bastidor'], marca:['marca','brand','make'], modelo:['modelo','model'], version:['version','versión','acabado'],
  anio:['año','ano','anio','year','matriculacion','fecha'], km:['km','kms','kilometros','kilómetros','kilometraje'], precio:['precio','pvp','price','importe','precio venta','precio contado','precio al contado','contado','pvp contado'], precioFin:['precio financiado','financiado','pvp financiado','precio fin','precio con financiacion','precio financiacion','precio financiando','financiacion'],
  combustible:['combustible','fuel','motor'], color:['color','colour'], estado:['estado','status','situacion','situación'], cat:['categoria','categoría','segmento','tipo','carroceria','carrocería','category'], notas:['notas','observaciones','comentarios']
};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').trim();
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.match(/\t/g) || []).length > 0 ? '\t' : (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function toNum(v){ if (v == null) return ''; let s = String(v).replace(/[€\s]/g, '').replace(/km/i, ''); if (!s) return ''; if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, ''); const n = parseFloat(s); return isNaN(n) ? '' : n; }
function canonEstado(v){
  const n = norm(v); if (!n) return estadoBase();
  const ex = estados().find(e => norm(e.name) === n); if (ex) return ex.name;
  const porTipo = t => (estados().find(e => e.tipo === t) || {}).name;
  if (n.startsWith('vend')) return porTipo('vendido') || estadoBase();
  if (n.startsWith('reserv') || n.startsWith('senal')) return porTipo('reservado') || estadoBase();
  if (n.includes('prepar') || n.includes('taller')) return porTipo('fuera') || estadoBase();
  if (n.startsWith('dispon') || n.startsWith('libre') || n.startsWith('venta')) return estadoBase();
  // estado nuevo que viene del Excel: se crea
  const nm = String(v).trim(); S.estados = [...estados(), {name:nm, color:CAT_PAL[estados().length % CAT_PAL.length], tipo:'expo'}]; return nm;
}
function canonFuel(v){ const n = norm(v); if (!n) return 'Gasolina'; if (n.includes('enchuf') || n.includes('phev') || n.includes('plug')) return 'Híbrido enchufable'; if (n.includes('hibr') || n.includes('hybr') || n.includes('hev')) return 'Híbrido'; if (n.includes('elect') || n === 'ev' || n.includes('bev')) return 'Eléctrico'; if (n.includes('glp') || n.includes('lpg') || n.includes('gnc')) return 'GLP'; if (n.includes('dies') || n.includes('gasoil') || n.includes('tdi') || n.includes('hdi')) return 'Diésel'; return 'Gasolina'; }
function ensureCat(name){
  const ex = cats().find(k => norm(k.name) === norm(name)); if (ex) return ex.id;
  if (!Array.isArray(S.cats)) S.cats = [];
  const k = {id:uid(), name:name.trim(), color:CAT_PAL[S.cats.length % CAT_PAL.length]}; S.cats = [...S.cats, k]; return k.id;
}
function importCars(text){
  const rows = parseCSV(text); if (rows.length < 2) return {error:'No encuentro filas. La primera fila tiene que ser la cabecera (Matrícula, Marca, Modelo, Precio…).'};
  const head = rows[0].map(norm); const map = {};
  // primero los nombres exactos; luego los que empiezan igual, sin repetir columna (así «Precio financiado» no se toma como precio al contado)
  for (const k in HEAD) { const i = head.findIndex(h => HEAD[k].some(a => h === norm(a))); if (i >= 0) map[k] = i; }
  const used = new Set(Object.values(map));
  for (const k in HEAD) if (map[k] == null) { const j = head.findIndex((h, idx) => !used.has(idx) && !(k === 'precio' && h.includes('financ')) && HEAD[k].some(a => h.startsWith(norm(a)))); if (j >= 0) { map[k] = j; used.add(j); } }
  if (map.matricula == null && map.marca == null) return {error:'No encuentro las columnas «Matrícula» ni «Marca» en la cabecera.'};
  let added = 0, updated = 0;
  mutate(() => {
    const byPlate = new Map(objs('car').map(c => [norm(c.matricula).replace(/ /g, ''), c]));
    for (const r of rows.slice(1)) {
      const g = k => map[k] != null ? String(r[map[k]] ?? '').trim() : '';
      const d = {matricula:g('matricula').toUpperCase(), marca:g('marca'), modelo:g('modelo'), version:g('version'), notas:g('notas'), color:g('color')};
      if (!d.matricula && !d.marca) continue;
      if (map.anio != null) { const a = g('anio').match(/(19|20)\d{2}/); d.anio = a ? +a[0] : ''; }
      if (map.km != null) d.km = toNum(g('km'));
      if (map.precio != null) d.precio = toNum(g('precio'));
      if (map.precioFin != null) d.precioFin = toNum(g('precioFin'));
      if (map.combustible != null) d.combustible = canonFuel(g('combustible'));
      if (map.estado != null) d.estado = canonEstado(g('estado'));
      if (map.cat != null) { const nm = g('cat'); d.cat = nm ? ensureCat(nm) : ''; }
      for (const k of Object.keys(d)) if (map[k] == null && k !== 'matricula') delete d[k];
      const ex = d.matricula && byPlate.get(norm(d.matricula).replace(/ /g, ''));
      if (ex) { Object.assign(ex, d); updated++; }
      else { const c = newCar(d); S.objs.push(c); if (d.matricula) byPlate.set(norm(d.matricula).replace(/ /g, ''), c); added++; }
    }
  });
  return {added, updated, cols:Object.keys(map)};
}
function openImport(){
  const ta = document.createElement('textarea'); ta.id = 'imp-text'; ta.placeholder = 'Matrícula;Marca;Modelo;Año;Km;Precio;Combustible;Color;Estado\n1234 ABC;Seat;León;2021;45000;16900;Gasolina;Blanco;Disponible';
  const fi = mkInput('imp-file', 'file', ''); fi.accept = '.csv,.txt,.tsv,text/csv,text/plain';
  fi.onchange = () => { const f = fi.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { let t = rd.result; if (t.includes('\uFFFD')) { const r2_ = new FileReader(); r2_.onload = () => { ta.value = r2_.result; }; r2_.readAsText(f, 'windows-1252'); } else ta.value = t; }; rd.readAsText(f, 'utf-8'); };
  modal('Importar stock', [
    P('Desde Excel: selecciona la tabla (con la fila de títulos) y pégala aquí, o guarda el Excel como «CSV (delimitado por punto y coma)» y elige el archivo.'),
    P('Columnas que entiendo: Matrícula, Marca, Modelo, Versión, Año, Km, Precio (o Precio contado), Precio financiado, Combustible, Color, Estado, Categoría (o Segmento) y Notas. Las categorías que no existan se crean solas. Si una matrícula ya existe, se actualizan sus datos y se queda en su plaza. Los coches nuevos van a «Sin colocar».'),
    mkField('Archivo CSV', fi, true), mkField('O pega aquí los datos', ta, true)
  ], [btn('Cancelar', closeModal), btn('Importar', () => {
    const r = importCars(ta.value);
    if (r.error) { toast(r.error); return; }
    closeModal(); toast(`${r.added} coches nuevos, ${r.updated} actualizados.`);
  }, 'primary')]);
}

// Guardar / abrir
async function download(name, text, type){
  if (dl) {
    try { await dl.save({filename:name, data:text}); }
    catch (e) { const c = e && e.code; if (c === 'declined') return; if (c === 'rate_limited') toast('Ya hay una descarga esperando: acéptala o recházala primero.'); else toast('No se ha podido descargar aquí. Usa el botón «Copiar».'); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); } catch (e) {}
}
function copyText(text, ta){
  const ok = () => toast('Copiado. Pégalo donde quieras guardarlo.');
  const fallback = () => { if (ta) { ta.hidden = false; ta.focus(); ta.select(); toast('Selecciona el texto y cópialo con Ctrl+C.'); } };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}
function stamp(){ const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function fileSafe(s){ return norm(s).replace(/ +/g, '-') || 'plano'; }
function listingCSV(){
  const cars = objs('car').slice().sort((a, b) => { const la = a.placed ? (a.spot ? byId(a.spot)?.label : 'zz') : 'zzz', lb = b.placed ? (b.spot ? byId(b.spot)?.label : 'zz') : 'zzz'; return natural(la, lb); });
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [['Plaza','Matrícula','Categoría','Marca','Modelo','Versión','Año','Km','Precio contado','Precio financiado','Combustible','Color','Estado','Notas'].join(';')];
  for (const c of cars) lines.push([c.placed ? (c.spot ? byId(c.spot)?.label : 'Fuera de plaza') : 'Sin colocar', c.matricula, catName(c), c.marca, c.modelo, c.version, c.anio, c.km, c.precio, c.precioFin, c.combustible, c.color, c.estado, c.notas].map(q).join(';'));
  return '﻿' + lines.join('\r\n');
}
function openFile(){
  const json = JSON.stringify(Object.assign({}, S, {objs:storeObjs()}));
  const taOut = document.createElement('textarea'); taOut.readOnly = true; taOut.value = json; taOut.hidden = true; taOut.id = 'bk-out';
  const csv = listingCSV();
  const taCsv = document.createElement('textarea'); taCsv.readOnly = true; taCsv.value = csv; taCsv.hidden = true; taCsv.id = 'bk-csv';
  const taIn = document.createElement('textarea'); taIn.id = 'bk-in'; taIn.placeholder = 'Pega aquí una copia guardada…';
  const fi = mkInput('bk-file', 'file', ''); fi.accept = '.json,application/json,text/plain';
  fi.onchange = () => { const f = fi.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { taIn.value = rd.result; }; rd.readAsText(f); };
  const h = t => { const e = document.createElement('h4'); e.textContent = t; e.style.cssText = 'margin:6px 0 0;font:600 14px var(--font-head)'; return e; };
  modal('Guardar / abrir', [
    P(mode === 'shared' ? (backend === 'cloud' ? 'El plano se guarda solo en la base de datos del equipo y lo ve todo el que tenga el enlace. Aun así, guarda una copia de vez en cuando por si alguien lo borra sin querer.' : 'El plano se guarda solo y lo comparten todos los que abren esta página. Aun así, guarda una copia de vez en cuando por si alguien lo borra sin querer.') : 'El plano se guarda solo en este navegador. Guarda una copia para pasarlo a otro ordenador o por si se borran los datos del navegador.'),
    h('Copia de seguridad del plano'),
    actions(btn('Descargar copia (.json)', () => download(`${fileSafe(S.name)}-${stamp()}.json`, json, 'application/json'), 'primary'), btn('Copiar al portapapeles', () => copyText(json, taOut))), taOut,
    h('Listado por plazas para Excel'),
    actions(btn('Descargar listado (.csv)', () => download(`listado-${fileSafe(S.name)}-${stamp()}.csv`, csv, 'text/csv;charset=utf-8')), btn('Copiar listado', () => copyText(csv.replace(/^﻿/, '').replace(/;/g, '\t'), taCsv))), taCsv,
    h('Abrir una copia'),
    mkField('Archivo', fi, true), taIn,
    actions(btn('Abrir copia', () => {
      try { const s = JSON.parse(taIn.value); if (!s || !Array.isArray(s.objs)) throw 0; mutate(() => { const c = S.colorBy; adopt(Object.assign(blankState(), s)); S.colorBy = c; sel.clear(); }, true); closeModal(); fit(); toast('Copia abierta. Si te equivocas, Ctrl+Z lo deshace.'); }
      catch (e) { toast('Ese texto no es una copia válida del plano.'); }
    })),
    h('Empezar de cero'),
    actions(btn('Plano nuevo…', () => { closeModal(); openNewPlan(); })),
    backend === 'cloud' && canWrite ? h('Este ordenador') : null,
    backend === 'cloud' && canWrite ? actions(btn('Olvidar la clave en este navegador', () => { closeModal(); logoutEdit(); })) : null
  ]);
}
function openNewPlan(){
  const iN = mkInput('n-name', 'text', 'Exposición'), iW = mkInput('n-w', 'number', S.W, {min:5}), iH = mkInput('n-h', 'number', S.H, {min:5});
  const keep = document.createElement('div'); keep.className = 'choices';
  const mk = (v, t, on) => { const l = document.createElement('label'); const r = document.createElement('input'); r.type = 'radio'; r.name = 'n-keep'; r.value = v; r.checked = on; l.append(r, t); return l; };
  keep.append(mk('none', 'Empezar vacío (sin plazas ni coches)', true), mk('cars', 'Conservar los coches del stock, pero quitarlos del plano', false), mk('layout', 'Conservar plazas y zonas, pero quitar todos los coches', false));
  modal('Plano nuevo', [P('Mide el recinto (ancho × fondo en metros). Lo puedes cambiar después.'), grid(mkField('Nombre', iN, true), mkField('Ancho (m)', iW), mkField('Fondo (m)', iH)), keep], [btn('Cancelar', closeModal), btn('Crear plano', () => {
    const k = document.querySelector('input[name="n-keep"]:checked').value;
    mutate(() => {
      const old = S.objs, wasSample = S.sample, cb = S.colorBy;
      const ns = blankState(); ns.colorBy = cb; ns.name = iN.value.trim() || 'Exposición'; ns.W = Math.max(5, +iW.value || 50); ns.H = Math.max(5, +iH.value || 34);
      if (k === 'cars' && !wasSample) ns.objs = old.filter(isCar).map(c => Object.assign(c, {placed:false, spot:null, pos:{}}));
      if (k === 'layout') ns.objs = old.filter(o => !isCar(o)).map(o => Object.assign(o, {plan:DEFAULT_PLAN}));
      activePlan = DEFAULT_PLAN; adopt(ns);
      sel.clear();
    }, true);
    closeModal(); fit(); toast('Plano creado. Dibuja las plazas con «+ Fila de plazas».');
  }, 'primary')]);
}

// Imagen
function openImage(){
  const keep = sel; sel = new Set(); renderPlan({clean:true});
  const c = svg.cloneNode(true); sel = keep; renderPlan();
  const m = 2.5, x = -m, y = -m - .5, w = S.W + 2 * m, h = S.H + 2 * m + 2;
  c.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  const ppm = Math.min(40, 4000 / w); const W = Math.round(w * ppm), H = Math.round(h * ppm);
  c.setAttribute('width', W); c.setAttribute('height', H);
  c.insertBefore(E('rect', {x, y, width:w, height:h, fill:cssv('--bg')}), c.firstChild);
  c.insertBefore(E('text', {x:0, y:-1.9, 'font-size':1, 'font-weight':700, fill:cssv('--fg'), 'font-family':cssv('--font-head')}, [document.createTextNode(`${S.name || 'Exposición'} · ${planName(activePlan)} · ${new Date().toLocaleDateString('es-ES')}`)]), c.lastChild.nextSibling);
  const src = new XMLSerializer().serializeToString(c);
  const url = URL.createObjectURL(new Blob([src], {type:'image/svg+xml'}));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url);
    let data = ''; try { data = cv.toDataURL('image/png'); } catch (e) {}
    let pngBlob = null; try { cv.toBlob(b => { pngBlob = b; }, 'image/png'); } catch (e) {}
    const out = document.createElement('img'); out.className = 'imgprev'; out.alt = 'Imagen del plano'; out.src = data || url;
    modal('Imagen del plano', [P('Haz clic derecho sobre la imagen (o mantén pulsado en el móvil) y elige «Guardar imagen» o «Copiar imagen» para mandarla por WhatsApp o correo.'), out], [btn('Descargar PNG', () => { const name = `${fileSafe(S.name)}-${stamp()}.png`; if (dl) { if (pngBlob) download(name, pngBlob); return; } if (!data) return; const a = document.createElement('a'); a.href = data; a.download = name; document.body.append(a); a.click(); a.remove(); }, 'primary')]);
  };
  img.onerror = () => toast('No he podido generar la imagen en este navegador.');
  img.src = url;
}

/* ---------- Render general ---------- */
function render(opts = {}){
  const typing = opts.remote && document.activeElement && $('#props').contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  renderTabs(); renderCatFilter(); renderEstadoFilter(); renderPlan(); renderList(); if (!typing) renderProps(); renderStats(); renderLegend();
  $('#bUndo').disabled = !undoS.length; $('#bRedo').disabled = !redoS.length;
  $('#colorBy').value = S.colorBy;
}

// Listas de sugerencias
(() => {
  const dl1 = document.createElement('datalist'); dl1.id = 'dl-marcas';
  ['Abarth','Alfa Romeo','Audi','BMW','BYD','Citroën','Cupra','Dacia','DS','Fiat','Ford','Honda','Hyundai','Jaguar','Jeep','Kia','Land Rover','Lexus','Mazda','Mercedes-Benz','MG','Mini','Mitsubishi','Nissan','Opel','Peugeot','Porsche','Renault','Seat','Skoda','Smart','SsangYong','Subaru','Suzuki','Tesla','Toyota','Volkswagen','Volvo'].forEach(m => { const o = document.createElement('option'); o.value = m; dl1.append(o); });
  const dl2 = document.createElement('datalist'); dl2.id = 'dl-colores';
  Object.keys(COLORES).filter(k => !['plateado','marron'].includes(k)).forEach(c => { const o = document.createElement('option'); o.value = c[0].toUpperCase() + c.slice(1); dl2.append(o); });
  document.body.append(dl1, dl2);
})();

// Aviso de versión nueva: el navegador puede guardar la página antigua unos minutos
async function checkUpdate(){
  if (location.protocol !== 'https:' && location.protocol !== 'http:') return;
  try {
    const t = await (await fetch('./?v=' + Date.now(), {cache:'no-store'})).text();
    const m = t.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION && !document.querySelector('.update')) {
      const d = document.createElement('div'); d.className = 'update'; d.setAttribute('role', 'status');
      d.append('Hay una versión nueva de Expo.');
      d.append(btn('Recargar', () => location.reload(), 'primary'));
      document.body.append(d);
    }
  } catch (e) {}
}
setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
$('#sync').addEventListener('click', () => { if (backend === 'cloud' && !canWrite) openPass(); });
$('#bAddCar').onclick = addCar;
$('#bRow').onclick = openRow;
$('#bZone').onclick = addZone;
$('#bText').onclick = addText;
$('#bSort').onclick = openSort;
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#bImport').onclick = openImport;
$('#bFile').onclick = openFile;
$('#bImg').onclick = openImage;
$('#bPrint').onclick = () => { const k = sel; sel = new Set(); fit(); renderPlan({clean:true}); window.print(); sel = k; render(); };
let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
if (inFrame) $('#bPrint').hidden = true;
$('#colorBy').onchange = e => { S.colorBy = e.target.value; lsSet(LS_KEY + '-color', S.colorBy); persist(); render(); };
$('#zIn').onclick = () => { const [x, y] = centerView(); zoomAt(1 / 1.3, x, y); };
$('#zOut').onclick = () => { const [x, y] = centerView(); zoomAt(1.3, x, y); };
$('#zFit').onclick = fit;
$('#zMulti').onclick = () => { multiMode = !multiMode; $('#zMulti').classList.toggle('on', multiMode); $('#zMulti').setAttribute('aria-pressed', multiMode); toast(multiMode ? 'Selección múltiple: toca plazas o coches para añadirlos, o arrastra un marco sobre el plano.' : 'Selección múltiple desactivada.'); };
new ResizeObserver(() => setViewBox()).observe(svg);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch (e) {}
new MutationObserver(() => render()).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

if (NUBE.url && NUBE.clave) {
  mode = 'connecting'; adopt(blankState()); S.colorBy = lsGet(LS_KEY + '-color') || 'estado';
  render(); requestAnimationFrame(fit);
  connectCloud();
} else if (window.claude && typeof window.claude.use === 'function') {
  mode = 'connecting'; adopt(blankState()); S.colorBy = lsGet(LS_KEY + '-color') || 'estado';
  render(); requestAnimationFrame(fit);
  connect();
} else {
  adopt(loadSaved() || sampleState()); persist();
  setSync('local'); render(); requestAnimationFrame(fit);
}
})();
</script>
